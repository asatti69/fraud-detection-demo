spring.application.name=fraud-api
server.port=8080

# Paths are relative to the api/ folder, where the app is started from.
fraud.model-path=../artifacts/fraud_autoencoder.onnx
fraud.metrics-path=../artifacts/metrics.json

# One JSON object per log line (Elastic Common Schema), so logs can be searched and parsed.
logging.structured.format.console=ecs
